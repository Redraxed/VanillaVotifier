name: Build VanillaVotifier

on:
  push:
    branches:
      - master
  pull_request:
    branches:
      - master
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: maven

      - name: Build shaded JAR
        run: mvn --batch-mode --no-transfer-progress package

      - name: Prepare downloadable JAR
        run: |
          mkdir -p dist
          cp target/VanillaVotifier-*-shaded.jar dist/VanillaVotifier.jar

      - name: Upload workflow artifact
        uses: actions/upload-artifact@v4
        with:
          name: VanillaVotifier
          path: dist/VanillaVotifier.jar
          if-no-files-found: error
          retention-days: 30

      - name: Publish latest master release
        if: github.event_name == 'push' && github.ref == 'refs/heads/master'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          notes="Automated shaded JAR built from commit ${GITHUB_SHA}."
          if gh release view latest --repo "${GITHUB_REPOSITORY}" >/dev/null 2>&1; then
            gh release upload latest dist/VanillaVotifier.jar --clobber --repo "${GITHUB_REPOSITORY}"
            gh release edit latest --title "Latest master build" --notes "${notes}" --latest --repo "${GITHUB_REPOSITORY}"
          else
            gh release create latest dist/VanillaVotifier.jar --title "Latest master build" --notes "${notes}" --latest --target "${GITHUB_SHA}" --repo "${GITHUB_REPOSITORY}"
          fi
